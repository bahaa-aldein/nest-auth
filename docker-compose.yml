services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Bound to localhost only: this MongoDB has no authentication.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
