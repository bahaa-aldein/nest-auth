name: nest-auth-prod

services:
  api:
    image: nest-auth-api:prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    # Must stay above SHUTDOWN_FORCE_MS (15 s) in backend/src/common/shutdown.service.ts.
    stop_grace_period: 20s
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:8080
      - MONGODB_URI=mongodb://root:${MONGO_PASSWORD}@mongo:27017/nest-auth?authSource=admin
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - REDIS_URL=redis://redis:6379
    secrets:
      - jwt_secret
    depends_on:
      redis:
        condition: service_healthy

  # web is also the proxy. The same nginx image serves the React files and passes /api to the
  # api copies, so there is one image and one container for both jobs. The mounted file
  # replaces the config inside the image. The dev stack does not use it (Vite serves the app there).
  web:
    image: nest-auth-web:prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Shared rate-limit counters: no volume (they live for a minute), no published port,
  # no password (only this stack reaches it).
  # The x-logging anchor does not work across files, so the log rotation is repeated.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password
    secrets:
      - mongo_password

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  mongo_password:
    environment: MONGO_PASSWORD
